name: Validar biblioteca

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar catálogo canônico
        run: python .github/scripts/generate_catalog.py --check
      - name: Validar estrutura sem executar scripts do acervo
        env:
          STRICT_PUBLIC: "1"
        run: python .github/scripts/validate_repository.py
